<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console | KPFC Fleet Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="maintenance-menu.js" defer></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 px-4 py-4 backdrop-blur sm:px-6">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4">
      <a href="/test-dashboard" class="flex items-center gap-3" aria-label="KPFC Fleet Management dashboard">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-700 text-white"><i data-lucide="truck" class="h-5 w-5"></i></span>
        <span><span class="block text-xs font-semibold uppercase text-blue-700">KPFC</span><span class="block text-base font-semibold">Fleet Management</span></span>
      </a>
      <nav class="order-3 flex w-full items-center gap-5 overflow-x-auto border-t border-slate-200 pt-3 text-xs font-medium text-slate-500 sm:order-2 sm:w-auto sm:border-0 sm:pt-0" aria-label="Fleet management navigation">
        <a href="/" class="whitespace-nowrap hover:text-blue-700">Home</a>
        <a href="/test-dashboard" class="whitespace-nowrap hover:text-blue-700">Fleet dashboard</a>
        <button id="maintenance-menu-trigger" type="button" onclick="toggleMaintenanceMenu(this)" aria-haspopup="dialog" aria-controls="maintenance-menu" aria-expanded="false" class="flex items-center gap-1 whitespace-nowrap font-semibold text-blue-700">
            <i data-lucide="wrench" class="h-3.5 w-3.5"></i> Maintenance
            <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
        </button>
      </nav>
      <button type="button" onclick="loadAdminParts()" title="Refresh parts" aria-label="Refresh parts" class="order-2 flex h-9 w-9 items-center justify-center rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 sm:order-3"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
    </div>
  </header>

  <div id="maintenance-menu" role="dialog" aria-modal="false" aria-labelledby="maintenance-menu-title" class="fixed left-0 top-0 z-[2000] hidden w-80 max-w-[calc(100vw-1rem)] translate-y-1 rounded-lg border border-slate-200 bg-white p-0 text-slate-900 opacity-0 shadow-xl ring-1 ring-black/5 transition-[opacity,transform] duration-150 ease-out">
    <div class="p-4">
      <div class="mb-3 flex items-center justify-between border-b border-slate-200 pb-3">
        <h2 id="maintenance-menu-title" class="text-sm font-semibold">Maintenance sections</h2>
        <button type="button" onclick="closeMaintenanceMenu(true)" aria-label="Close navigation" class="flex h-8 w-8 items-center justify-center rounded-md text-slate-500 hover:bg-slate-100"><i data-lucide="x" class="h-4 w-4"></i></button>
      </div>
      <nav class="grid gap-1" aria-label="Maintenance sections">
        <a href="/maintenance" class="flex items-center gap-3 rounded-md px-3 py-3 text-sm hover:bg-slate-100"><i data-lucide="wrench" class="h-4 w-4 text-blue-700"></i>Maintenance</a>
        <a href="/inventory" class="flex items-center gap-3 rounded-md px-3 py-3 text-sm hover:bg-slate-100"><i data-lucide="package" class="h-4 w-4 text-emerald-700"></i>Inventory</a>
        <a href="/admin-console" aria-current="page" class="flex items-center gap-3 rounded-md bg-slate-100 px-3 py-3 text-sm font-semibold text-slate-800"><i data-lucide="shield-check" class="h-4 w-4"></i>Admin Console</a>
      </nav>
    </div>
  </div>

  <main class="mx-auto max-w-7xl space-y-6 px-4 py-6 sm:px-6">
    <section class="flex flex-wrap items-end justify-between gap-3">
      <div><p class="text-xs font-semibold uppercase text-emerald-700">Fleet operations</p><h1 class="mt-1 text-2xl font-bold">Admin Console</h1></div>
      <a href="/inventory" class="text-xs font-semibold text-emerald-800 hover:text-emerald-900">View inventory</a>
    </section>

    <section class="grid grid-cols-1 gap-6 xl:grid-cols-[minmax(0,0.8fr)_minmax(0,1.2fr)]">
      <div class="space-y-4">
        <div class="border-b border-slate-300 pb-3"><h2 class="text-base font-semibold">Create inventory part</h2></div>
        <form id="inventory-create-form" class="space-y-3 rounded-lg border border-slate-200 bg-white p-4" onsubmit="submitInventoryPart(event)">
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div><label for="inventory-part-number" class="text-xs font-semibold text-slate-600">Part number</label><input id="inventory-part-number" required maxlength="100" type="text" placeholder="P-1001" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none"></div>
            <div><label for="inventory-part-name" class="text-xs font-semibold text-slate-600">Name</label><input id="inventory-part-name" required maxlength="255" type="text" placeholder="Brake Pad Kit" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none"></div>
            <div><label for="inventory-part-category" class="text-xs font-semibold text-slate-600">Category</label><select id="inventory-part-category" required class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none"><option value="mechanical">Mechanical</option><option value="cosmetic_body">Cosmetic / Body</option></select></div>
            <div><label for="inventory-part-location" class="text-xs font-semibold text-slate-600">Location</label><input id="inventory-part-location" maxlength="100" type="text" placeholder="Warehouse A" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none"></div>
            <div><label for="inventory-part-quantity" class="text-xs font-semibold text-slate-600">Starting quantity</label><input id="inventory-part-quantity" required type="number" min="0" value="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none"></div>
            <div><label for="inventory-part-minimum" class="text-xs font-semibold text-slate-600">Minimum quantity</label><input id="inventory-part-minimum" required type="number" min="0" value="2" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none"></div>
          </div>
          <div><label for="inventory-part-description" class="text-xs font-semibold text-slate-600">Description</label><textarea id="inventory-part-description" rows="3" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none"></textarea></div>
          <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-lg bg-emerald-700 px-3 py-2.5 text-xs font-semibold text-white hover:bg-emerald-800"><i data-lucide="plus" class="h-4 w-4"></i>Create part</button>
        </form>
      </div>

      <div class="space-y-4">
        <div class="flex flex-wrap items-end justify-between gap-3 border-b border-slate-300 pb-3">
          <h2 class="text-base font-semibold">Stock adjustments</h2>
          <input id="admin-part-search" type="search" oninput="renderAdminParts()" placeholder="Search part number or name" class="w-56 rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs focus:border-emerald-600 focus:outline-none">
        </div>
        <div id="admin-part-list" class="space-y-2"><p class="text-sm text-slate-500">Loading parts...</p></div>
      </div>
    </section>
  </main>

  <div id="page-message" class="pointer-events-none fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-lg bg-slate-900 px-4 py-3 text-xs text-white shadow-xl" role="status"></div>

  <script>
    let adminParts = [];

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadAdminParts();
    });

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { 'Accept': 'application/json', ...(options.headers || {}) }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || 'The request failed.');
      return result;
    }

    async function loadAdminParts() {
      try {
        const result = await fetchJson('/api/inventory/parts');
        adminParts = result.data || [];
        renderAdminParts();
      } catch (error) {
        document.getElementById('admin-part-list').textContent = 'Could not load inventory parts.';
        showMessage(error.message, true);
      }
    }

    function renderAdminParts() {
      const query = document.getElementById('admin-part-search').value.trim().toLowerCase();
      const visibleParts = adminParts.filter(part => `${part.name || ''} ${part.part_number || ''}`.toLowerCase().includes(query));
      const list = document.getElementById('admin-part-list');
      list.innerHTML = '';
      if (!visibleParts.length) {
        list.textContent = adminParts.length ? 'No matching parts.' : 'No inventory parts found.';
        return;
      }

      visibleParts.forEach(part => {
        const item = document.createElement('article');
        item.className = 'rounded-lg border border-slate-200 bg-white p-4';
        const heading = document.createElement('div');
        heading.className = 'flex flex-wrap items-start justify-between gap-2';
        const details = document.createElement('div');
        const name = document.createElement('h3');
        name.className = 'text-sm font-semibold text-slate-900';
        name.textContent = part.name;
        const meta = document.createElement('p');
        meta.className = 'mt-1 text-[11px] text-slate-500';
        meta.textContent = `${part.part_number || 'No part number'} · ${part.location || 'Warehouse'} · ${part.quantity} in stock`;
        details.append(name, meta);
        const stock = document.createElement('span');
        const lowStock = Number(part.quantity) <= Number(part.minimum_quantity);
        stock.className = `rounded-full px-2 py-1 text-[10px] font-semibold ${lowStock ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'}`;
        stock.textContent = lowStock ? 'Low stock' : 'In stock';
        heading.append(details, stock);

        const actions = document.createElement('div');
        actions.className = 'mt-3 flex flex-wrap gap-2';
        actions.append(
          createAdjustmentButton('+10 restock', 'bg-emerald-50 text-emerald-800 hover:bg-emerald-100', part.id, 10, 'restock'),
          createAdjustmentButton('-1 used', 'bg-amber-50 text-amber-800 hover:bg-amber-100', part.id, -1, 'job_card_usage'),
          createAdjustmentButton('-5 adjust', 'bg-rose-50 text-rose-800 hover:bg-rose-100', part.id, -5, 'adjustment')
        );
        item.append(heading, actions);
        list.append(item);
      });
    }

    function createAdjustmentButton(label, style, partId, adjustment, movementType) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `rounded-md px-2.5 py-1.5 text-[10px] font-semibold ${style}`;
      button.textContent = label;
      button.addEventListener('click', () => adjustStock(partId, adjustment, movementType, label));
      return button;
    }

    async function adjustStock(partId, adjustment, movementType, notes) {
      try {
        const result = await fetchJson(`/api/inventory/parts/${partId}/adjust`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adjustment, movement_type: movementType, notes })
        });
        showMessage(result.message || 'Stock adjusted successfully.');
        await loadAdminParts();
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    async function submitInventoryPart(event) {
      event.preventDefault();
      const payload = {
        part_number: document.getElementById('inventory-part-number').value.trim(),
        name: document.getElementById('inventory-part-name').value.trim(),
        category: document.getElementById('inventory-part-category').value,
        location: document.getElementById('inventory-part-location').value.trim() || null,
        quantity: Number(document.getElementById('inventory-part-quantity').value),
        minimum_quantity: Number(document.getElementById('inventory-part-minimum').value),
        description: document.getElementById('inventory-part-description').value.trim() || null
      };

      try {
        const result = await fetchJson('/api/inventory/parts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('inventory-create-form').reset();
        document.getElementById('inventory-part-category').value = 'mechanical';
        document.getElementById('inventory-part-quantity').value = '0';
        document.getElementById('inventory-part-minimum').value = '2';
        showMessage(result.message || 'Inventory part created.');
        await loadAdminParts();
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    function showMessage(message, isError = false) {
      const box = document.getElementById('page-message');
      box.textContent = message;
      box.classList.toggle('bg-rose-800', isError);
      box.classList.toggle('bg-slate-900', !isError);
      box.classList.remove('hidden');
      clearTimeout(showMessage.timeout);
      showMessage.timeout = setTimeout(() => box.classList.add('hidden'), 3500);
    }
  </script>
</body>
</html>
