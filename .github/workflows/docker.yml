name: Docker CI/CD

on:
  push:
    branches:
      - docker-cicd-aapanel
  pull_request:
    branches:
      - docker-cicd-aapanel

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/emushene/tracker-kpfc
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Deploy to server only on push events
  deploy:
    name: Deploy Containers to Server
    needs: docker-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to aaPanel server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            cd /var/www/fleet.kpfcbuilders.com

            echo "==> Logging in to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "==> Pulling latest Fleet image"
            docker pull ghcr.io/emushene/tracker-kpfc:latest

            echo "==> Recreating Fleet application containers"
            docker compose up -d --force-recreate app scheduler nginx

            echo "==> Fleet container status"
            docker compose ps

            echo "==> Cleaning dangling images"
            docker image prune -f