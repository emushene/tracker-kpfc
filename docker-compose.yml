services:

  app:
    image: ghcr.io/emushene/tracker-kpfc:latest
    container_name: kpfc-fleet-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - fleet-public:/var/www/html/public
      - fleet-storage:/var/www/html/storage
    networks:
      - fleet

  scheduler:
    image: ghcr.io/emushene/tracker-kpfc:latest
    container_name: kpfc-fleet-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - fleet-storage:/var/www/html/storage
    networks:
      - fleet

  nginx:
    image: nginx:alpine
    container_name: kpfc-fleet-nginx
    restart: unless-stopped
    ports:
      - "18083:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - fleet-public:/var/www/html/public:ro
      - fleet-storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - fleet

volumes:
  fleet-public:
  fleet-storage:

networks:
  fleet:
    driver: bridge